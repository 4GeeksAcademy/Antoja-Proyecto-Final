# render.yaml (Versión final y correcta para un proyecto con Pipenv)

services:
  # 1. El servicio de la base de datos (sin cambios)
  - type: psql
    name: postgresql-trapezoidal-42170
    region: ohio
    plan: free

  # 2. El servicio web (tu API)
  - type: web
    name: sample-service-name
    region: ohio
    plan: free
    env: python # Render detectará Pipenv automáticamente

    # Comando de Build: Solo instala dependencias usando Pipenv.
    # --deploy asegura que use Pipfile.lock y falle si no coinciden.
    # --system instala los paquetes en el entorno virtual del sistema.
    buildCommand: "pipenv install --deploy --system"
    
    # Comando de Inicio: ¡AQUÍ ESTÁ LA MAGIA!
    # Primero, ejecuta las migraciones. Si funciona (&&), entonces inicia el servidor.
    startCommand: "flask db upgrade && gunicorn src.app:app"
    
    # Variables de entorno (sin cambios)
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: postgresql-trapezoidal-42170
          property: connectionString
      - key: FLASK_APP
        value: src.app.py
      - key: FLASK_DEBUG
        value: "0"
      - key: FLASK_APP_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.10.6
      - key: VITE_BASENAME
        value: /