# render.yaml (Versión corregida para el problema de red)

services:
  # 1. El servicio de la base de datos PostgreSQL
  - type: psql
    name: postgresql-trapezoidal-42170 # Usamos el nombre que ya tienes
    region: ohio
    plan: free
    # ipAllowList: [] # No es necesario, la configuración por defecto es segura

  # 2. El servicio web (tu API)
  - type: web
    name: sample-service-name # Usamos el nombre que ya tienes
    region: ohio
    plan: free
    env: python # Mantenemos tu entorno original por ahora
    
    # El build command que intentamos antes, que debería funcionar ahora
    buildCommand: "./render_build.sh" 
    
    # El start command corregido
    startCommand: "gunicorn src.app:app"
    
    # Variables de entorno
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: postgresql-trapezoidal-42170 # ¡La conexión explícita!
          property: connectionString
      
      # Definimos FLASK_APP aquí para que esté disponible en el build
      - key: FLASK_APP
        value: src/app.py

      # Las otras variables que ya tenías
      - key: FLASK_DEBUG
        value: "0"
      - key: FLASK_APP_KEY
        generateValue: true # Mucho más seguro que 'any key works'
      - key: PYTHON_VERSION
        value: 3.10.6 # Mantenemos la versión que especificaste
      - key: VITE_BASENAME
        value: /
